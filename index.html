<script>
/* ===========================================================================
   启动兜底脚本（普通脚本，先于模块执行）
   本应用是「数据 + 三维渲染」结构，初始化链条很长（加载 2MB 模块 → 解析地理
   数据 → 建 79 根光柱 → 装配界面）。原先把整条链子暴露在模块顶层，任何一步
   抛错都会让模块静默死掉，而加载页没有任何失败出口 —— 表现为「一直加载中」，
   且不给任何原因。这里补上三件事：
     1. 捕获全局错误与模块加载失败，把原因显示在加载页上；
     2. 看门狗：超过 18 秒仍未启动完成，主动报出「卡在哪一步」；
     3. 给出重试与跳过按钮，保证用户永远有出口。
   =========================================================================== */
(function () {
  var STAGES = ['构建三维地形', '加载诗词数据', '生成地势起伏', '点亮诗境地标', '装配界面与题库'];
  var lastStage = '构建三维地形';
  var lastPct = 8;

  window.__loadFailed = false;

  function el(id) { return document.getElementById(id); }

  /** 由主模块调用，报告当前进度。既让用户看到「在动」，也方便定位卡在哪一步。 */
  window.__bootStage = function (text, pct) {
    lastStage = text || lastStage;
    if (typeof pct === 'number') lastPct = pct;
    var sub = el('loaderSub');
    if (sub) sub.textContent = lastStage;
    var bar = el('loaderBarFill');
    if (bar) bar.style.width = lastPct + '%';
  };

  window.__loadError = function (msg, kind) {
    // 已经启动成功就不再打扰
    if (window.__app || window.__loadFailed) return;
    window.__loadFailed = true;

    var box = el('loaderFail');
    var text = el('lfMsg');
    var hint = el('lfHint');
    if (text) text.textContent = String(msg || '未知错误').slice(0, 400);
    if (hint) {
      if (kind === 'timeout') {
        hint.innerHTML = '页面已等待 18 秒仍未完成初始化。<br/>' +
          '最后停在：<b>' + lastStage + '</b>（' + lastPct + '%）。<br/>' +
          '常见原因：网络较慢导致模块未加载完；显卡/浏览器禁用了 WebGL。';
      } else if (kind === 'webgl') {
        hint.innerHTML = '当前浏览器无法创建 WebGL 画布。<br/>' +
          '请在浏览器设置中开启「硬件加速」，或改用 Chrome / Edge 打开。';
      } else {
        hint.innerHTML = '若以 file:// 直接打开会失败，请改用本地服务器：<br/>' +
          '<b>python3 serve.py</b> 然后访问 http://127.0.0.1:8777/';
      }
    }
    if (box) box.classList.remove('hidden');
    var l = el('loader');
    if (l) l.classList.add('failed');
  };

  // 全局兜底：模块顶层抛错、事件回调抛错都会走到这里
  window.addEventListener('error', function (e) {
    // 资源（img/script）加载失败没有 message，只处理真正的运行时错误
    if (e && e.message) window.__loadError(e.message, 'runtime');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    window.__loadError((r && r.message) || r || 'Promise 未处理的拒绝', 'runtime');
  });

  // 看门狗
  setTimeout(function () {
    if (!window.__app) window.__loadError('初始化超时', 'timeout');
  }, 18000);

  // WebGL 预检：拿不到上下文时提前给出可读的原因，而不是让 THREE 抛一行栈
  window.__hasWebGL = function () {
    try {
      var c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext &&
        (c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (err) { return false; }
  };

  document.addEventListener('DOMContentLoaded', function () {
    var sub = el('loaderSub');
    var lf = el('lfRetry');
    var sk = el('lfSkip');
    if (lf) lf.onclick = function () { location.reload(); };
    if (sk) sk.onclick = function () {
      var l = el('loader');
      if (l) { l.classList.add('done'); setTimeout(function () { l.remove(); }, 800); }
    };

    // ES Module 无法在 file:// 下加载，给出明确指引
    if (location.protocol === 'file:') {
      if (sub) sub.textContent = '需要本地服务器';
      window.__loadError('以 file:// 打开时浏览器会拦截模块脚本', 'file');
      return;
    }
    if (!window.__hasWebGL()) {
      window.__loadError('无法创建 WebGL 上下文', 'webgl');
      return;
    }
    if (sub) sub.textContent = '加载三维引擎与诗词数据…';
  });
})();
</script>
